[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advicedoc"
version = "0.1.0"
description = "Document intelligence for a financial-advice platform: a calibrated document classifier over ten advice document types, Statement-of-Advice extraction (rules / LLM / LLM+validators), deterministic validators, a calibrated human-review router, advice-vs-implementation reconciliation, and a durable workflow with an HTTP API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
  "rapidfuzz>=3.5",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Run a Hugging Face chat model in-process for the llm / llm_validated strategies.
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
serve = ["uvicorn[standard]>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
]

[project.scripts]
advicedoc = "advicedoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
advicedoc = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG", "ASYNC"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "reportlab.*",
  "sklearn.*",
  "joblib.*",
  "scipy.*",
  "torch.*",
  "transformers.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "uvicorn.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=advicedoc --cov-report=term-missing"
markers = [
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["advicedoc"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
