# docker compose -f deploy/docker-compose.yml up --build            → app on :8080 (scripted model)
# docker compose -f deploy/docker-compose.yml --profile vllm up     → app + vLLM (needs an NVIDIA GPU)
# The app talks to any OpenAI-compatible endpoint: point FILENOTE_MODEL__BASE_URL at vLLM,
# Ollama, Azure OpenAI, Vertex AI or the owner's llm-gateway-release.
name: filenote

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: filenote/app:0.1.0
    ports:
      - "8080:8080"
    environment:
      FILENOTE_MODEL__KIND: ${FILENOTE_MODEL__KIND:-fake}
      FILENOTE_MODEL__BASE_URL: ${FILENOTE_MODEL__BASE_URL:-http://vllm:8000/v1}
      FILENOTE_MODEL__MODEL: ${FILENOTE_MODEL__MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      FILENOTE_DRAFT__STRATEGY: ${FILENOTE_DRAFT__STRATEGY:-verified}
      FILENOTE_PSEUDONYMISE: ${FILENOTE_PSEUDONYMISE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed}
    volumes:
      - filenote-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.85"
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  filenote-data: {}
  hf-cache: {}
