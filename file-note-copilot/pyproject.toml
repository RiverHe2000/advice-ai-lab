[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filenote"
version = "0.1.0"
description = "Drafts a financial adviser's file note from a client-meeting transcript with transcript evidence on every claim, a deterministic claim verifier, an adviser approval step, an audit trail, PII minimisation and a Cloud Run deployment path."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Run a Hugging Face chat model in-process as the drafting model.
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0"]
# `filenote transcribe <wav>` through faster-whisper.
audio = ["faster-whisper>=1.0"]
# Optional semantic-support check in the verifier (cached BAAI/bge-small-en-v1.5).
semantic = ["sentence-transformers>=3.0"]
serve = ["uvicorn[standard]>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "hypothesis>=6.100",
  "playwright>=1.45",
  "uvicorn>=0.30",
]

[project.scripts]
filenote = "filenote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filenote = ["py.typed", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG", "ASYNC"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "transformers.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "faster_whisper.*",
  "sentence_transformers.*",
  "uvicorn.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=filenote --cov-report=term-missing"
markers = [
  "e2e: browser end-to-end tests (Playwright); skipped when chromium cannot launch unless REQUIRE_E2E=1",
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["filenote"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
